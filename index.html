<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All in One — Lik</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f17; --card:#141a26; --line:#232c3d; --text:#e6ebf5; --muted:#8b97ad;
    --accent:#00e0b8; --accent2:#7c5cff; --warn:#ffb547; --line2:#5a6782;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);
       padding:16px;max-width:960px;margin:0 auto;line-height:1.5}
  header{padding:20px 0 12px}
  h1{font-size:1.6rem;background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:.95rem}
  .stats{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem}
  .stat b{color:var(--accent);font-size:1.1rem;margin-right:4px}
  #q{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);
     background:var(--card);color:var(--text);font:inherit;font-size:1rem}
  #q:focus{outline:2px solid var(--accent);border-color:transparent}
  #q::placeholder{color:var(--muted);opacity:1}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
  .chip{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);
        background:var(--card);color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer}
  .chip.on{background:var(--accent);color:#04211b;border-color:var(--accent);font-weight:600}
  h2{font-size:1.05rem;margin:18px 0 8px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
        display:flex;flex-direction:column;gap:6px}
  .card h3{font-size:1rem;word-break:break-word}
  .card p{color:var(--muted);font-size:.88rem;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:.75rem;padding:2px 8px;border-radius:6px;background:#1d2534;color:var(--muted)}
  .tag.local{background:#3a2a10;color:var(--warn)}
  .links{display:flex;gap:10px;margin-top:4px}
  .links a{display:inline-flex;align-items:center;min-height:44px;font-size:.85rem;text-decoration:none;padding:6px 14px;border-radius:8px;
           border:1px solid var(--line);color:var(--text)}
  .links a.site{border-color:var(--accent);color:var(--accent)}
  .chip:focus-visible,.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  footer{color:var(--muted);font-size:.8rem;text-align:center;padding:30px 0 10px}
</style>
</head>
<body>
<header>
  <h1>All in One</h1>
  <p class="sub">รวมผลงานทุกชิ้นของลิกไว้ที่เดียว — ค้นหาง่าย ไม่กระจัดกระจาย</p>
  <div class="stats" id="stats"></div>
</header>

<input id="q" type="search" placeholder="ค้นหา เช่น เงิน, POS, python…">
<div class="chips" id="chips"></div>
<main id="list"></main>

<footer>เพิ่มโปรเจกต์ใหม่: แก้ array <code>PROJECTS</code> ใน index.html แล้ว commit</footer>

<script>
// ====== ข้อมูลโปรเจกต์ (เพิ่ม/แก้ตรงนี้ที่เดียว) ======
// repo  = ชื่อรีโพบน GitHub (ว่างไว้ถ้ายังไม่ได้อัปขึ้น)
// site  = ลิงก์เว็บที่เปิดใช้ได้ (ถ้ามี)
// web   = true ถ้ารีโพนั้นเปิด GitHub Pages แล้ว (ลิงก์เว็บจะสร้างให้อัตโนมัติ)
// cat   = หมวดหมู่ ต้องตรงกับใน CATS
// owner = บัญชี/องค์กรเจ้าของรีโพ (ใส่เฉพาะเมื่อไม่ใช่ USER)
const USER = 'zetxero-main';
const CATS = ['การเงิน','งานร้าน','POS','Vending','เรียนรู้','AI & เครื่องมือ','อื่นๆ'];

const PROJECTS = [
  // --- การเงิน ---
  {name:'BUDGET//CTRL', repo:'budgetctrl', web:true, cat:'การเงิน', desc:'บันทึกการเงิน หนี้สิน งบประมาณ เป้าหมายออม'},
  {name:'Cash-Flow', repo:'Cash-Flow', web:true, cat:'การเงิน', desc:'แอปจัดการเงินส่วนตัว — หนึ่งในโปรเจกต์แรกๆ'},
  {name:'Cash Manager (Manage//Cash Flow)', repo:'cash-manager', web:true, cat:'การเงิน', desc:'My CashFlow — รายการเงิน เงินกู้ เครดิต สรุปผล แนบรูปใบเสร็จ · เวอร์ชัน Firebase ซิงก์ข้ามเครื่อง กราฟ Canvas ส่งออก CSV'},
  {name:'cashrc', repo:'cashrc', cat:'การเงิน', desc:'แอปบันทึกเงิน (สร้างจาก Acode)'},
  {name:'salary', repo:'salary', web:true, cat:'การเงิน', desc:'บันทึกเงินเดือน CP ALL'},
  {name:'สมุดบัญชีออมทรัพย์', repo:'', cat:'การเงิน', desc:'เว็บออมเงินสไตล์สมุดบัญชี เป้าเป็น % ของเงินเดือน'},
  {name:'record-inex', repo:'', cat:'การเงิน', desc:'Python + Excel บันทึกรายรับรายจ่าย'},
  {name:'finance-app', repo:'', cat:'การเงิน', desc:'Flask + SQLite แอปการเงินส่วนตัว (ทำใน Termux)'},

  // --- งานร้าน 7-Eleven ---
  {name:'timein-out', repo:'timein-out', web:true, cat:'งานร้าน', desc:'บันทึกเวลาเข้า-ออกงาน'},
  {name:'ShiftMate', repo:'shiftmate', web:true, cat:'งานร้าน', desc:'จัดตารางงานพนักงานรายสัปดาห์ เน้นมือถือ เก็บใน localStorage · มี backend Flask + SQLite เสริม ส่งออก JSON/CSV/XLSX'},
  {name:'expiry-tracker (PMA)', repo:'', cat:'งานร้าน', desc:'ติดตามสินค้าใกล้หมดอายุ แจ้งเตือนล่วงหน้า'},
  {name:'shift-sales-report', repo:'', cat:'งานร้าน', desc:'storerecord.py บันทึกยอดขายรายกะ'},
  {name:'rider-check-order', repo:'', cat:'งานร้าน', desc:'เช็กลิสต์ส่งของไรเดอร์'},

  // --- POS ---
  {name:'POS Mobile HTML5', repo:'pos-mobile', web:true, cat:'POS', desc:'POS เต็มระบบ + backend Python/SQLite'},
  {name:'Mobile POS V2', repo:'', cat:'POS', desc:'Tkinter + SQLite บน Pydroid 3'},

  // --- Vending ---
  {name:'vender', repo:'vender', web:true, cat:'Vending', desc:'สต๊อกสินค้า — เพิ่ม/ลดสินค้า หมวดหมู่ แจ้งเตือนใกล้หมดและหมดอายุ'},
  {name:'ivenmachine', repo:'ivenmachine', web:true, cat:'Vending', desc:'งานตู้ Vending ครบในที่เดียว — สถานะเครื่อง เหรียญ ผังช่อง ใบเติมสินค้า xlsx · วางข้อความจาก CMS (รวม vending-status แล้ว)'},

  // --- เรียนรู้ ---
  {name:'python-lessons', repo:'python-lessons', web:true, cat:'เรียนรู้', desc:'คอร์ส Python สู่การวิเคราะห์ข้อมูล 5 บท พร้อมแบบฝึกหัด'},
  {name:'python', repo:'python', web:true, cat:'เรียนรู้', desc:'เว็บเรียน Python'},
  {name:'learnhtml5', repo:'learnhtml5', web:true, cat:'เรียนรู้', desc:'เรียน HTML5'},
  {name:'30 วัน พื้นฐาน Python', repo:'readme', cat:'เรียนรู้', desc:'สรุปพื้นฐาน Python 30 วันเป็นภาษาไทย (Markdown แบ่งเป็น 10 ตอน)'},
  {name:'online-book', repo:'', cat:'เรียนรู้', desc:'เว็บอ่านหนังสือ มือถือ บันทึกตำแหน่งที่อ่าน'},

  // --- AI & เครื่องมือ ---
  {name:'Diary (บันทึกของฉัน)', repo:'Diary', web:true, cat:'AI & เครื่องมือ', desc:'เว็บบันทึกส่วนตัว เขียนจากมือถือได้ (Astro + Sveltia CMS)'},
  {name:'project-skills', repo:'project-skills', cat:'AI & เครื่องมือ', desc:'คลังสกิล แยกตามโปรเจกต์'},
  {name:'tasky', repo:'tasky', cat:'AI & เครื่องมือ', desc:'จัดการงาน (Python)'},
  {name:'tasky-web', repo:'tasky-web', web:true, cat:'AI & เครื่องมือ', desc:'จัดการงาน (เวอร์ชันเว็บ)'},
  {name:'ollama-webchat', repo:'', cat:'AI & เครื่องมือ', desc:'เว็บแชทกับ Ollama ใน Termux'},
  {name:'file-organizer', repo:'', cat:'AI & เครื่องมือ', desc:'Python CLI จัดไฟล์ลงโฟลเดอร์ตามประเภท'},

  // --- อื่นๆ ---
  {name:'root-home', repo:'root-home', cat:'อื่นๆ', desc:'โฮมไดเรกทอรีรวมหลายโปรเจกต์ (Cash-Flow, pos-mobile, shiftmate ฯลฯ)'},
  {name:'โปรไฟล์ GitHub', repo:'zetxero-ceo', owner:'zetxero-ceo', cat:'อื่นๆ', desc:'README หน้าโปรไฟล์'},
  {name:'community', repo:'community', cat:'อื่นๆ', desc:'Community Hub — พื้นที่พูดคุย ไอเดีย ถาม-ตอบ และประกาศ (GitHub Discussions)'},
  {name:'clothing-shop', repo:'', cat:'อื่นๆ', desc:'เว็บโชว์เสื้อผ้า สั่งผ่าน LINE + หน้าแอดมิน'},
  {name:'zetxero (เว็บเอเจนซี่การตลาด)', repo:'all-in-one', site:'zetxero/', cat:'อื่นๆ', desc:'หน้าแรกเว็บเอเจนซี่การตลาดดิจิทัล — ดีไซน์ธีมน้ำเงิน/มิ้นต์ (อยู่ในโฟลเดอร์ zetxero/)'},
];

// ====== แสดงผล ======
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cat = 'ทั้งหมด';

function renderStats(){
  const onGit = PROJECTS.filter(p => p.repo).length;
  $('#stats').innerHTML =
    `<div class="stat"><b>${PROJECTS.length}</b>โปรเจกต์</div>` +
    `<div class="stat"><b>${onGit}</b>อยู่บน GitHub</div>` +
    `<div class="stat"><b>${PROJECTS.length - onGit}</b>ยังไม่อัปขึ้น</div>`;
}

function renderChips(){
  $('#chips').innerHTML = ['ทั้งหมด', ...CATS].map(c =>
    `<button class="chip${c === cat ? ' on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}

function card(p){
  const links = [];
  const site = p.site || (p.web && p.repo ? `https://${USER}.github.io/${p.repo}/` : '');
  if (site) links.push(`<a class="site" href="${esc(site)}" target="_blank" rel="noopener">เปิดเว็บ</a>`);
  if (p.repo) links.push(`<a href="https://github.com/${esc(p.owner || USER)}/${esc(p.repo)}" target="_blank" rel="noopener">GitHub</a>`);
  return `<div class="card">
    <h3>${esc(p.name)}</h3>
    <p>${esc(p.desc || '')}</p>
    <div class="tags"><span class="tag">${esc(p.cat)}</span>${p.repo ? '' : '<span class="tag local">ยังไม่ขึ้น GitHub</span>'}</div>
    ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
  </div>`;
}

// ตัวพิมพ์เล็ก, - _ / = ช่องว่าง, ยุบช่องว่างซ้ำ
const norm = s => String(s).toLowerCase().replace(/[-_/]/g, ' ').replace(/\s+/g, ' ').trim();

function renderList(){
  const words = norm($('#q').value).split(' ').filter(Boolean);
  const items = PROJECTS.filter(p => {
    if (cat !== 'ทั้งหมด' && p.cat !== cat) return false;
    if (!words.length) return true;
    const hay = norm([p.name || '', p.desc || '', p.repo || '', p.cat || ''].join(' '));
    return words.every(w => hay.includes(w));
  });
  if (!items.length){ $('#list').innerHTML = '<p class="empty">ไม่พบโปรเจกต์</p>'; return; }
  const cats = cat === 'ทั้งหมด' ? CATS : [cat];
  $('#list').innerHTML = cats.map(c => {
    const group = items.filter(p => p.cat === c);
    return group.length ? `<h2>${esc(c)} (${group.length})</h2><div class="grid">${group.map(card).join('')}</div>` : '';
  }).join('');
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.cat; renderChips(); renderList();
});
$('#q').addEventListener('input', renderList);

renderStats(); renderChips(); renderList();
</script>
</body>
</html>
